
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      font-family: Arial, sans-serif;
      color: #1e293b;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 12px 35px #0003;
    }

    h1 {
      color: #2563eb;
      font-size: 32px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    .tools {
      background: #eff6ff;
      border-radius: 12px;
      padding: 16px;
      margin: 24px 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Hello, World!</h1>

    <h2>Welcome to My First Website</h2>

    <p>
      Hi! I am Renielle Andre B. Granada of IT3R1, an IT student.
      This is my SemiFinal PIT Project Part 1.
    </p>

    <div class="tools">
      <strong>Tools Used</strong>
      <p>HTML | CSS | VS Code | XAMPP | GitHub</p>
    </div>

    <button onclick="showMessage()">
      Click Me!
    </button>

    <footer>
      SemiFinal PIT Part 1 | Web Development
    </footer>
  </div>

  <script>
    function showMessage() {
      alert("Hello! Welcome to my project!");
    }
  </script>
</body>
</html>
